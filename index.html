<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de Vendas | Tropa do 7</title>
<meta name="description" content="Calculadora de vendas da Tropa do 7 com e sem parceria.">
<meta name="theme-color" content="#04090c">
<meta property="og:title" content="Calculadora de Vendas | Tropa do 7">
<meta property="og:description" content="Calcule o total, o depósito pro painel e a comissão do vendedor.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧮</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#03080b;--panel:#071217;--panel2:#0a1b22;--line:#1d3f48;--cy:#35e6ff;--cy2:#12a8c4;--tx:#e8fbff;--mut:#7fb3bd;--gr:#4dff9a;--gold:#ffd24d}
*{box-sizing:border-box;margin:0}
html{color-scheme:dark}
body{background:var(--bg);color:var(--tx);font-family:Rajdhani,'Segoe UI',Arial,sans-serif;min-height:100vh;position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse at 50% -10%,#0e3a47 0,transparent 60%),radial-gradient(ellipse at 90% 100%,#07252d 0,transparent 50%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;opacity:.25;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:radial-gradient(circle at 50% 30%,#000,transparent 75%);mask-image:radial-gradient(circle at 50% 30%,#000,transparent 75%)}
.wrap{max-width:760px;margin:0 auto;padding:34px 16px 24px}
header{text-align:center;margin-bottom:26px}
.tag{display:inline-block;font:12px 'Share Tech Mono',monospace;letter-spacing:4px;color:var(--cy);border:1px solid var(--line);padding:4px 12px;margin-bottom:12px;background:rgba(53,230,255,.06)}
h1{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:clamp(54px,14vw,96px);line-height:.95;letter-spacing:3px;background:linear-gradient(180deg,#fff,#9fc3cc 55%,#5b7f89);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(53,230,255,.7)) drop-shadow(0 0 28px rgba(53,230,255,.35))}
.sub{margin-top:8px;color:var(--mut);letter-spacing:5px;font-weight:600;font-size:15px}
.switch{display:grid;grid-template-columns:1fr 1fr;position:relative;border:1px solid var(--line);background:var(--panel);padding:4px;margin-bottom:16px}
.switch button{position:relative;z-index:1;padding:13px 8px;background:none;border:0;color:var(--mut);font:700 18px Rajdhani,sans-serif;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:color .25s}
.switch button.on{color:#02161c}
.thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:linear-gradient(90deg,var(--cy2),var(--cy));box-shadow:0 0 20px rgba(53,230,255,.55);transition:transform .3s cubic-bezier(.4,0,.2,1)}
.switch.sem .thumb{transform:translateX(100%)}
.items{display:grid;gap:10px}
.item{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;background:linear-gradient(90deg,var(--panel2),var(--panel));border:1px solid var(--line);padding:12px 14px;transition:border-color .2s,box-shadow .2s}
.item.act{border-color:var(--cy);box-shadow:0 0 18px rgba(53,230,255,.2)}
.ico{width:52px;height:52px;display:grid;place-items:center;border:1px solid var(--line);background:radial-gradient(circle,#0b2a33,#041015)}
.ico svg{width:32px;height:32px;stroke:var(--cy);fill:rgba(53,230,255,.14);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px var(--cy))}
.nm{font-size:20px;font-weight:700;line-height:1.1}
.un{font:14px 'Share Tech Mono',monospace;color:var(--cy);margin-top:3px}
.sb{font:13px 'Share Tech Mono',monospace;color:var(--mut);margin-top:2px;min-height:17px}
.qty{display:flex;align-items:center}
.qty button{width:40px;height:42px;background:#0d2630;color:var(--cy);border:1px solid var(--line);font-size:22px;cursor:pointer;transition:background .15s}
.qty button:hover{background:#12394a}
.qty input{width:70px;height:42px;text-align:center;background:#02080a;color:var(--tx);border:1px solid var(--line);border-left:0;border-right:0;font:20px 'Share Tech Mono',monospace;-moz-appearance:textfield}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none}
.qty input:focus{outline:none;background:#04161c}
.sum{margin-top:20px;display:grid;gap:10px}
.box{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--mut)}
.box span{font-size:19px;font-weight:600;letter-spacing:.5px}
.box small{display:block;font-size:13px;color:var(--mut);font-weight:500}
.box b{font:400 clamp(22px,6vw,30px) 'Share Tech Mono',monospace;white-space:nowrap}
.box.t{border-left-color:var(--cy)}.box.t b{color:var(--tx)}
.box.d{border-left-color:var(--gold);background:linear-gradient(90deg,rgba(255,210,77,.09),var(--panel))}.box.d b{color:var(--gold)}
.box.v{border-left-color:var(--gr)}.box.v b{color:var(--gr)}
.cnt{text-align:center;color:var(--mut);font:13px 'Share Tech Mono',monospace;margin-top:12px;letter-spacing:1px}
.act-row{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-top:14px}
.btn{padding:14px;background:none;border:1px solid var(--line);color:var(--mut);font:700 16px Rajdhani,sans-serif;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .2s}
.btn:hover{border-color:var(--cy);color:var(--cy)}
.btn.main{background:linear-gradient(90deg,var(--cy2),var(--cy));color:#02161c;border-color:var(--cy)}
.btn.main:hover{color:#02161c;box-shadow:0 0 20px rgba(53,230,255,.5)}
footer{text-align:center;margin-top:30px;color:#4d7480;font:12px 'Share Tech Mono',monospace;letter-spacing:2px}
@media(max-width:560px){.item{grid-template-columns:44px 1fr;row-gap:10px}.ico{width:44px;height:44px}.qty{grid-column:1/3;justify-content:center}.qty input{flex:1;max-width:none}.qty button{width:56px}}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="tag">// SISTEMA DE VENDAS</div>
<h1>TROPA DO 7</h1>
<div class="sub">CALCULADORA DE PREÇOS</div>
</header>

<div class="switch" id="sw">
<div class="thumb"></div>
<button id="b1" class="on">Com parceria</button>
<button id="b0">Sem parceria</button>
</div>

<div class="items" id="list"></div>

<div class="sum">
<div class="box t"><span>Total vendido<small>valor de tudo que foi selecionado</small></span><b id="tot">R$ 0,00</b></div>
<div class="box d"><span>Depósito pro painel<small>total menos os 30% do vendedor</small></span><b id="dep">R$ 0,00</b></div>
<div class="box v"><span>Comissão do vendedor<small>30% do total</small></span><b id="ven">R$ 0,00</b></div>
</div>
<div class="cnt" id="cnt">0 ITENS SELECIONADOS</div>

<div class="act-row">
<button class="btn main" id="cp">Copiar resumo</button>
<button class="btn" id="clr">Limpar</button>
</div>
<footer>TROPA DO 7 © 2026</footer>
</div>

<script>
const ICO={
leaf:'<svg viewBox="0 0 24 24"><path d="M12 13C9.5 10 9.5 5.5 12 2c2.5 3.5 2.5 8 0 11z"/><path d="M12 14C9 14 6 12 4 8c4 0 6.500 1.500 8 4.500z"/><path d="M12 14c3 0 6-2 8-6-4 0-6.500 1.500-8 4.500z"/><path d="M12 16.500c-2.500.5-5.500-1-7-3.500 3-.5 5.500.5 7 2z"/><path d="M12 16.500c2.500.5 5.500-1 7-3.500-3-.5-5.500.5-7 2z"/><path d="M12 15v7"/></svg>',
glock:'<svg viewBox="0 0 24 24"><path d="M9 10V7c0-2.500 1.500-4.500 3-4.500S15 4.500 15 7v3z"/><rect x="9" y="10" width="6" height="10.500"/><path d="M8 20.500h8V22H8z"/><circle cx="12" cy="17.500" r="1.400"/></svg>',
five:'<svg viewBox="0 0 24 24"><path d="M10.200 11V8.500c0-3 .8-6 1.800-6s1.800 3 1.800 6V11z"/><path d="M10.200 11 8.700 13.500v7h6.600v-7L13.800 11z"/><path d="M8 20.500h8V22H8z"/><circle cx="12" cy="17.800" r="1.300"/></svg>',
m4:'<svg viewBox="0 0 24 24"><path d="M9.500 9V6.500c0-2.500 1.300-4.500 2.500-4.500s2.500 2 2.500 4.500V9z"/><path d="M9.500 9 7.500 12.500v8h9v-8L14.500 9z"/><path d="M7 20.500h10V22H7z"/><circle cx="12" cy="17.300" r="1.500"/><path d="M7.500 14.500h9"/></svg>',
m60:'<svg viewBox="0 0 24 24"><path d="M9 8.500V6c0-2.500 1.500-4.500 3-4.500S15 3.500 15 6v2.500z"/><path d="M9 8.500 7 12v8.500h10V12l-2-3.500z"/><path d="M6.500 20.500h11V22h-11z"/><circle cx="12" cy="17.300" r="1.500"/><path d="M7 14.500h10M7 12.500h10"/></svg>'};
const items=[
{n:'Maconha',i:'leaf',c:600,s:700},
{n:'Munição de Five-Seven',i:'five',c:527,s:585},
{n:'Munição de Glock',i:'glock',c:527,s:585},
{n:'Munição de M4A1',i:'m4',c:661.5,s:735},
{n:'Munição de M60',i:'m60',c:661.5,s:735}];
let par=true;const q=items.map(()=>0);
const $=id=>document.getElementById(id);
const fmt=v=>'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
function build(){
const l=$('list');l.innerHTML='';
items.forEach((it,i)=>{
const d=document.createElement('div');d.className='item';d.id='it'+i;
d.innerHTML='<div class="ico">'+ICO[it.i]+'</div><div><div class="nm">'+it.n+'</div><div class="un" id="p'+i+'"></div><div class="sb" id="s'+i+'"></div></div><div class="qty"><button data-i="'+i+'" data-d="-1" aria-label="Diminuir">−</button><input type="number" min="0" inputmode="numeric" id="q'+i+'" value="'+q[i]+'" aria-label="Quantidade"><button data-i="'+i+'" data-d="1" aria-label="Aumentar">+</button></div>';
l.appendChild(d);});
l.querySelectorAll('button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;q[i]=Math.max(0,q[i]+ +b.dataset.d);$('q'+i).value=q[i];calc();});
l.querySelectorAll('input').forEach((x,i)=>x.oninput=()=>{q[i]=Math.max(0,parseInt(x.value)||0);calc();});
calc();}
function calc(){
let t=0,n=0;
items.forEach((it,i)=>{const p=par?it.c:it.s,sub=p*q[i];t+=sub;n+=q[i];
$('p'+i).textContent=fmt(p)+' / un.';
$('s'+i).textContent=q[i]?q[i]+' × = '+fmt(sub):'';
$('it'+i).classList.toggle('act',q[i]>0);});
$('tot').textContent=fmt(t);
$('dep').textContent=fmt(t*0.7);
$('ven').textContent=fmt(t*0.3);
$('cnt').textContent=n+(n===1?' ITEM SELECIONADO':' ITENS SELECIONADOS');}
function setP(v){par=v;$('b1').classList.toggle('on',v);$('b0').classList.toggle('on',!v);$('sw').classList.toggle('sem',!v);calc();}
$('b1').onclick=()=>setP(true);$('b0').onclick=()=>setP(false);
$('clr').onclick=()=>{q.fill(0);build();};
$('cp').onclick=async()=>{
const lines=['TROPA DO 7 - '+(par?'COM':'SEM')+' PARCERIA'];
items.forEach((it,i)=>{if(q[i])lines.push(q[i]+'x '+it.n+' = '+fmt((par?it.c:it.s)*q[i]));});
lines.push('Total: '+$('tot').textContent,'Depósito pro painel: '+$('dep').textContent,'Vendedor (30%): '+$('ven').textContent);
const b=$('cp'),o=b.textContent;
try{await navigator.clipboard.writeText(lines.join('\n'));b.textContent='Copiado!';}catch(e){b.textContent='Não foi possível copiar';}
setTimeout(()=>b.textContent=o,1600);};
build();
</script>
</body>
</html>
